<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Mouse Maze Math</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🐭</text></svg>" />
    <meta name="theme-color" content="#2a2540" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud" hidden>
      <div class="hud-row">
        <button class="chip hud-home" data-act="leave" aria-label="Leave the maze">🏠</button>
        <span id="lvl" class="chip"></span>
        <span class="spacer"></span>
        <span id="streak" class="chip"></span>
        <span id="cheese" class="chip"></span>
      </div>
      <div id="progress"><div id="bar"></div></div>
      <div id="q"><div id="qtext"></div><div id="qhint"></div></div>
    </div>
    <div id="answers" class="off"></div>
    <div id="toast"></div>
    <div id="screen" hidden></div>
    <!-- "Leave the maze?" sits above everything. The round keeps running behind it. -->
    <div id="leave" hidden>
      <div class="card">
        <h2>Leave the maze?</h2>
        <div class="sub" id="leave-sub">Cheese you earned is kept.</div>
        <div class="row leave-row">
          <button class="btn leave-btn yes" data-act="leave-yes" aria-label="Yes, leave the maze">✔</button>
          <button class="btn leave-btn no" data-act="leave-no" aria-label="No, stay in the maze">✖</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
